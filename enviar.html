<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendar Actividad | CONALEP</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="script.js"></script>
</head>
<body>
    
    <header>
        <div class="header-container">
            <h1>Compartir Actividades con un Amigo</h1>
            <nav><a href="index.html" class="btn-inicio">Volver al Inicio</a></nav>
        </div>
    </header>

    <main>
        <form action="mailto:vianney@correo.com" method="post" enctype="text/plain">
            <fieldset>
                <legend>Recomendación Directa</legend>
                
                <div class="form-group">
                    <label for="remitente">Tu Nombre:</label>
                    <input type="text" id="remitente" required>
                </div>

                <div class="form-group">
                    <label for="destinatario">Correo de tu Compañero:</label>
                    <input type="email" id="destinatario" required>
                </div>

                <div class="form-group">
                    <label for="nota">Mensaje:</label>
                    <textarea id="nota" rows="3"></textarea>
                </div>

                <div class="acciones">
                    <input type="submit" value="Enviar Invitación" class="btn-submit">
                </div>
            </fieldset>
        </form>

        <section style="margin-top: 30px;">
            <table class="tabla-eventos">
                <caption>Horarios Base de las Actividades Compartidas</caption>
                <thead>
                    <tr>
                        <th>Clasificación</th>
                        <th>Horario Oficial</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Eventos de Tecnología de Mañana</td>
                        <td>10:00 AM</td>
                    </tr>
                    <tr>
                        <td>Muestras Culturales de Tarde</td>
                        <td>04:00 PM</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p style="text-align: center;"><a href="index.html" class="enlace-boton">Inicio</a></p>
    </footer>
</body>
</html>
